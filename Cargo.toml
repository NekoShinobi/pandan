[workspace]
members = ["crates/db", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.51.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
